<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>

  <text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif"
        font-size="34" font-weight="700">AI Coding Agent Architecture</text>
  <text x="60" y="110" fill="#94a3b8" font-family="Arial, sans-serif"
        font-size="19">Iterative reasoning driven by real tool results</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="210" width="210" height="110" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="175" y="255" text-anchor="middle" fill="#93c5fd" font-size="18">USER</text>
    <text x="175" y="290" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Coding request</text>

    <rect x="370" y="210" width="210" height="110" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="475" y="255" text-anchor="middle" fill="#c4b5fd" font-size="18">MODEL</text>
    <text x="475" y="290" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">LLM reasoning</text>

    <rect x="670" y="210" width="210" height="110" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="775" y="255" text-anchor="middle" fill="#6ee7b7" font-size="18">TOOLS</text>
    <text x="775" y="290" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Local actions</text>

    <rect x="930" y="210" width="200" height="110" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="1030" y="255" text-anchor="middle" fill="#fcd34d" font-size="18">RESULT</text>
    <text x="1030" y="290" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Feedback</text>

    <line x1="280" y1="265" x2="360" y2="265" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="580" y1="265" x2="660" y2="265" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="880" y1="265" x2="920" y2="265" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M1030 330 C1030 480 475 480 475 330"
          fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="188" y="505" width="824" height="92" rx="16" fill="#111c31" stroke="#334155"/>
    <text x="600" y="542" text-anchor="middle" fill="#f8fafc"
          font-size="20" font-weight="700">Conversation History</text>
    <text x="600" y="574" text-anchor="middle" fill="#94a3b8"
          font-size="17">assistant message → matching tool result → next reasoning cycle</text>

    <text x="775" y="365" text-anchor="middle" fill="#94a3b8" font-size="16">
      list • read • write • execute
    </text>
  </g>
</svg>
